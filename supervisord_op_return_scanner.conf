[program:op_return_scanner]
command=/home/ubuntu/crypto_basis/venv/bin/python3 /home/ubuntu/crypto_basis/op_return_scanner.py --continual-scanning --interval 60 --heartbeat 360
directory=/home/ubuntu/crypto_basis
user=ubuntu
autostart=true
autorestart=true
startretries=3
startsecs=10
stopwaitsecs=30
stdout_logfile=/home/ubuntu/crypto_basis/logs/op_return_scanner.log
stderr_logfile=/home/ubuntu/crypto_basis/logs/op_return_scanner_error.log
stdout_logfile_maxbytes=10MB
stderr_logfile_maxbytes=10MB
stdout_logfile_backups=5
stderr_logfile_backups=5
environment=PATH="/home/ubuntu/crypto_basis/venv/bin:%(ENV_PATH)s"

